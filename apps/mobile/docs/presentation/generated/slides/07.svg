<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#163B74" flood-opacity="0.12"/>
      </filter>
      <clipPath id="phoneClip"><rect x="1166" y="95" width="304" height="660" rx="42"/></clipPath>
    </defs>
    
    
    <rect width="1600" height="900" fill="#F0F8FF"/>
    <circle cx="1510" cy="-30" r="245" fill="#FF2462" opacity="0.11"/>
    <circle cx="35" cy="910" r="210" fill="#6D28D9" opacity="0.09"/>
    <rect x="64" y="46" width="308" height="42" rx="21" fill="#FFE4EE"/>
    <text x="218" y="74" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="218" dy="0">KIDS AND FAMILY SAFETY</tspan>
  </text>
    <text x="64" y="132" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="48" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Fun on the surface. Guardrails</tspan><tspan x="64" dy="56">underneath.</tspan>
  </text>
    <line x1="64" y1="842" x2="1536" y2="842" stroke="#BFE2FA" stroke-width="2"/>
    <text x="64" y="874" fill="#4F6990" font-family="Arial" font-size="17" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">FunBerry Kids</tspan>
  </text>
    <text x="1536" y="874" fill="#4F6990" font-family="Arial" font-size="17" font-weight="700" text-anchor="end" opacity="1"  letter-spacing="0">
    <tspan x="1536" dy="0">07</tspan>
  </text>
  
    <text x="64" y="220" fill="#4F6990" font-family="Arial" font-size="25" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">The product avoids pretending that child safety is one switch; it is built from</tspan><tspan x="64" dy="34">account separation, constrained navigation and adult control.</tspan>
  </text>
    <rect x="64" y="315" width="714" height="194" rx="24" fill="#FFE4EE" stroke="#BFE2FA" stroke-width="2"/>
        <circle cx="118" cy="371" r="27" fill="#FF2462"/>
   <text x="118" y="378.02" fill="#FFFFFF" font-family="Arial Rounded MT Bold" font-size="23.22" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="118" dy="0">A</tspan>
  </text>
        <text x="164" y="378" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="23" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="164" dy="0">Adult authority</tspan>
  </text>
        
          <circle cx="176" cy="418" r="4" fill="#FF2462"/>
          <text x="192" y="424" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">Grown-up owns the account</tspan>
  </text>
        
          <circle cx="176" cy="448" r="4" fill="#FF2462"/>
          <text x="192" y="454" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">Child profiles are subordinate</tspan>
  </text>
        
          <circle cx="176" cy="478" r="4" fill="#FF2462"/>
          <text x="192" y="484" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">Sensitive controls remain adult-facing</tspan>
  </text>
        <rect x="808" y="315" width="714" height="194" rx="24" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
        <circle cx="862" cy="371" r="27" fill="#FFE4EE"/>
   <text x="862" y="378.02" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="23.22" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="862" dy="0">W</tspan>
  </text>
        <text x="908" y="378" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="23" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="908" dy="0">Controlled web content</tspan>
  </text>
        
          <circle cx="920" cy="418" r="4" fill="#FF2462"/>
          <text x="936" y="424" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">Only ticketed game routes open</tspan>
  </text>
        
          <circle cx="920" cy="448" r="4" fill="#FF2462"/>
          <text x="936" y="454" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">Unexpected navigation is blocked</tspan>
  </text>
        
          <circle cx="920" cy="478" r="4" fill="#FF2462"/>
          <text x="936" y="484" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">External URLs leave the app safely</tspan>
  </text>
        <rect x="64" y="539" width="714" height="194" rx="24" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
        <circle cx="118" cy="595" r="27" fill="#FFE4EE"/>
   <text x="118" y="602.02" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="23.22" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="118" dy="0">D</tspan>
  </text>
        <text x="164" y="602" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="23" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="164" dy="0">Data control</tspan>
  </text>
        
          <circle cx="176" cy="642" r="4" fill="#FF2462"/>
          <text x="192" y="648" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">Export request path</tspan>
  </text>
        
          <circle cx="176" cy="672" r="4" fill="#FF2462"/>
          <text x="192" y="678" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">Account deletion path</tspan>
  </text>
        
          <circle cx="176" cy="702" r="4" fill="#FF2462"/>
          <text x="192" y="708" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="192" dy="0">Explicit privacy and legal links</tspan>
  </text>
        <rect x="808" y="539" width="714" height="194" rx="24" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
        <circle cx="862" cy="595" r="27" fill="#FFE4EE"/>
   <text x="862" y="602.02" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="23.22" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="862" dy="0">R</tspan>
  </text>
        <text x="908" y="602" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="23" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="908" dy="0">Responsible design</tspan>
  </text>
        
          <circle cx="920" cy="642" r="4" fill="#FF2462"/>
          <text x="936" y="648" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">No ads or invented social features</tspan>
  </text>
        
          <circle cx="920" cy="672" r="4" fill="#FF2462"/>
          <text x="936" y="678" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">No open chat or stranger contact</tspan>
  </text>
        
          <circle cx="920" cy="702" r="4" fill="#FF2462"/>
          <text x="936" y="708" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="936" dy="0">Read-only plan presentation</tspan>
  </text>
        
  
  </svg>