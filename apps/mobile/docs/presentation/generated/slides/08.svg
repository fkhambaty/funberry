<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#163B74" flood-opacity="0.12"/>
      </filter>
      <clipPath id="phoneClip"><rect x="1166" y="95" width="304" height="660" rx="42"/></clipPath>
    </defs>
    
    
    <rect width="1600" height="900" fill="#F0F8FF"/>
    <circle cx="1510" cy="-30" r="245" fill="#FF2462" opacity="0.11"/>
    <circle cx="35" cy="910" r="210" fill="#6D28D9" opacity="0.09"/>
    <rect x="64" y="46" width="272" height="42" rx="21" fill="#FFE4EE"/>
    <text x="200" y="74" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="200" dy="0">MOBILE ARCHITECTURE</tspan>
  </text>
    <text x="64" y="132" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="48" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">A native family shell with</tspan><tspan x="64" dy="56">controlled game reuse</tspan>
  </text>
    <line x1="64" y1="842" x2="1536" y2="842" stroke="#BFE2FA" stroke-width="2"/>
    <text x="64" y="874" fill="#4F6990" font-family="Arial" font-size="17" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">FunBerry Kids</tspan>
  </text>
    <text x="1536" y="874" fill="#4F6990" font-family="Arial" font-size="17" font-weight="700" text-anchor="end" opacity="1"  letter-spacing="0">
    <tspan x="1536" dy="0">08</tspan>
  </text>
  
    <text x="64" y="220" fill="#4F6990" font-family="Arial" font-size="25" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Core family journeys remain native; selected complex games reuse existing content</tspan><tspan x="64" dy="34">through a tightly constrained bridge.</tspan>
  </text>
    <rect x="64" y="325" width="330" height="300" rx="24" fill="#FFE4EE" stroke="#BFE2FA" stroke-width="2"/>
    <text x="92" y="370" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="92" dy="0">Android + iOS</tspan>
  </text>
    <text x="92" y="407" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="92" dy="0">One React Native product</tspan><tspan x="92" dy="23">with branded platform</tspan><tspan x="92" dy="23">packaging and icons.</tspan>
  </text>
    <rect x="482" y="325" width="330" height="300" rx="24" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
    <text x="510" y="370" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="510" dy="0">Native family shell</tspan>
  </text>
    <text x="510" y="407" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="510" dy="0">Auth, dashboard, profiles,</tspan><tspan x="510" dy="23">picker, zones, rewards,</tspan><tspan x="510" dy="23">progress and settings.</tspan>
  </text>
    <rect x="900" y="325" width="330" height="300" rx="24" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
    <text x="928" y="370" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="928" dy="0">Ticketed game WebView</tspan>
  </text>
    <text x="928" y="407" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="928" dy="0">Only authorised</tspan><tspan x="928" dy="23">complex-game routes run</tspan><tspan x="928" dy="23">inside the controlled web</tspan><tspan x="928" dy="23">surface.</tspan>
  </text>
    <rect x="1318" y="325" width="218" height="300" rx="24" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
    <text x="1346" y="370" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="22" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1346" dy="0">Existing services</tspan>
  </text>
    <text x="1346" y="407" fill="#4F6990" font-family="Arial" font-size="16" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1346" dy="0">Accounts, child</tspan><tspan x="1346" dy="23">state, game</tspan><tspan x="1346" dy="23">tickets, rewards</tspan><tspan x="1346" dy="23">and progress APIs.</tspan>
  </text>
    <path d="M 402 475 L 467 475" stroke="#FF2462" stroke-width="5" stroke-linecap="round"/>
    <path d="M 467 475 l -16 -12 m 16 12 l -16 12" stroke="#FF2462" stroke-width="5" fill="none"/>
    <path d="M 820 475 L 885 475" stroke="#FF2462" stroke-width="5" stroke-linecap="round"/>
    <path d="M 885 475 l -16 -12 m 16 12 l -16 12" stroke="#FF2462" stroke-width="5" fill="none"/>
    <path d="M 1238 475 L 1303 475" stroke="#FF2462" stroke-width="5" stroke-linecap="round"/>
    <path d="M 1303 475 l -16 -12 m 16 12 l -16 12" stroke="#FF2462" stroke-width="5" fill="none"/>
    <rect x="64" y="690" width="450" height="42" rx="21" fill="#FF2462"/>
    <text x="289" y="718" fill="#FFFFFF" font-family="Arial Rounded MT Bold" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="289" dy="0">NATIVE: FAMILY CONTROLS + SIMPLE GAMES</tspan>
  </text>
    <rect x="540" y="690" width="500" height="42" rx="21" fill="#FFFFFF"/>
    <text x="790" y="718" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="790" dy="0">WEBVIEW: AUTHORISED COMPLEX GAMES</tspan>
  </text>
    <rect x="1066" y="690" width="470" height="42" rx="21" fill="#FFE4EE"/>
    <text x="1301" y="718" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="1301" dy="0">GUARDRAILS: TICKET + ALLOWLIST + EXIT</tspan>
  </text>
  
  </svg>