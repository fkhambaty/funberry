<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#163B74" flood-opacity="0.12"/>
      </filter>
      <clipPath id="phoneClip"><rect x="1166" y="95" width="304" height="660" rx="42"/></clipPath>
    </defs>
    
    
    <rect width="1600" height="900" fill="#F0F8FF"/>
    <circle cx="1510" cy="-30" r="245" fill="#FF2462" opacity="0.11"/>
    <circle cx="35" cy="910" r="210" fill="#6D28D9" opacity="0.09"/>
    <rect x="64" y="46" width="332" height="42" rx="21" fill="#FFE4EE"/>
    <text x="230" y="74" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="230" dy="0">EVERY USER POINT OF VIEW</tspan>
  </text>
    <text x="64" y="132" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="48" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Designed for a family, not one</tspan><tspan x="64" dy="56">generic user</tspan>
  </text>
    <line x1="64" y1="842" x2="1536" y2="842" stroke="#BFE2FA" stroke-width="2"/>
    <text x="64" y="874" fill="#4F6990" font-family="Arial" font-size="17" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">FunBerry Kids</tspan>
  </text>
    <text x="1536" y="874" fill="#4F6990" font-family="Arial" font-size="17" font-weight="700" text-anchor="end" opacity="1"  letter-spacing="0">
    <tspan x="1536" dy="0">03</tspan>
  </text>
  
    <text x="64" y="220" fill="#4F6990" font-family="Arial" font-size="26" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">Each person gets the right level of control, language and complexity.</tspan>
  </text>
    <rect x="64" y="320" width="351.5" height="430" rx="28" fill="#FFE4EE" stroke="#BFE2FA" stroke-width="2"/>
        <circle cx="122" cy="380" r="31" fill="#FF2462"/>
   <text x="122" y="388.06" fill="#FFFFFF" font-family="Arial Rounded MT Bold" font-size="26.66" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="122" dy="0">G</tspan>
  </text>
        <text x="94" y="466" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="26" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="94" dy="0">Visiting grown-up</tspan>
  </text>
        <text x="94" y="540" fill="#4F6990" font-family="Arial" font-size="18" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="94" dy="0">“Is this right for my</tspan><tspan x="94" dy="25">family?”</tspan>
  </text>
        <line x1="94" y1="625" x2="385.5" y2="625" stroke="#BFE2FA" stroke-width="2"/>
        <text x="94" y="663" fill="#163B74" font-family="Arial" font-size="17" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="94" dy="0">A clear welcome, product</tspan><tspan x="94" dy="24">promise, sign-in and free</tspan><tspan x="94" dy="24">account path.</tspan>
  </text><rect x="437.5" y="320" width="351.5" height="430" rx="28" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
        <circle cx="495.5" cy="380" r="31" fill="#FFE4EE"/>
   <text x="495.5" y="388.06" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="26.66" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="495.5" dy="0">P</tspan>
  </text>
        <text x="467.5" y="466" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="26" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="467.5" dy="0">Parent or guardian</tspan>
  </text>
        <text x="467.5" y="540" fill="#4F6990" font-family="Arial" font-size="18" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="467.5" dy="0">“Set it up and keep it</tspan><tspan x="467.5" dy="25">safe.”</tspan>
  </text>
        <line x1="467.5" y1="625" x2="759" y2="625" stroke="#BFE2FA" stroke-width="2"/>
        <text x="467.5" y="663" fill="#163B74" font-family="Arial" font-size="17" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="467.5" dy="0">Dashboard, child profiles,</tspan><tspan x="467.5" dy="24">PINs, progress, settings,</tspan><tspan x="467.5" dy="24">export and deletion.</tspan>
  </text><rect x="811" y="320" width="351.5" height="430" rx="28" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
        <circle cx="869" cy="380" r="31" fill="#FFE4EE"/>
   <text x="869" y="388.06" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="26.66" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="869" dy="0">C</tspan>
  </text>
        <text x="841" y="466" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="26" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="841" dy="0">Child player</tspan>
  </text>
        <text x="841" y="540" fill="#4F6990" font-family="Arial" font-size="18" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="841" dy="0">“Let me pick and play!”</tspan>
  </text>
        <line x1="841" y1="625" x2="1132.5" y2="625" stroke="#BFE2FA" stroke-width="2"/>
        <text x="841" y="663" fill="#163B74" font-family="Arial" font-size="17" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="841" dy="0">Friendly profile picker,</tspan><tspan x="841" dy="24">themed zones, games, tickets</tspan><tspan x="841" dy="24">and rewards.</tspan>
  </text><rect x="1184.5" y="320" width="351.5" height="430" rx="28" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
        <circle cx="1242.5" cy="380" r="31" fill="#FFE4EE"/>
   <text x="1242.5" y="388.06" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="26.66" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="1242.5" dy="0">F</tspan>
  </text>
        <text x="1214.5" y="466" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="26" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1214.5" dy="0">Returning family</tspan>
  </text>
        <text x="1214.5" y="540" fill="#4F6990" font-family="Arial" font-size="18" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1214.5" dy="0">“Continue without</tspan><tspan x="1214.5" dy="25">confusion.”</tspan>
  </text>
        <line x1="1214.5" y1="625" x2="1506" y2="625" stroke="#BFE2FA" stroke-width="2"/>
        <text x="1214.5" y="663" fill="#163B74" font-family="Arial" font-size="17" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1214.5" dy="0">Remembered account, fast child</tspan><tspan x="1214.5" dy="24">selection and persistent</tspan><tspan x="1214.5" dy="24">progress.</tspan>
  </text>
  
  </svg>