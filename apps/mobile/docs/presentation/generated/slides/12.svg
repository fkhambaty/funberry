    <text x="202" y="96" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="202" dy="0">APPROVAL DECISION</tspan>
  </text>
    <text x="78" y="210" fill="#FFFFFF" font-family="Arial Rounded MT Bold" font-size="72" font-weight="850" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="78" dy="0">Approve a safer, smarter</tspan><tspan x="78" dy="79">kind of play</tspan>
  </text>
    <text x="82" y="440" fill="#D9EAFE" font-family="Arial" font-size="28" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="82" dy="0">The product experience, family model and technical</tspan><tspan x="82" dy="39">foundation are ready. Owner-controlled signing and</tspan><tspan x="82" dy="39">store operations are the final gates.</tspan>
  </text>
    <rect x="82" y="600" width="450" height="150" rx="26" fill="#FF2462" stroke="#FF2462" stroke-width="2"/>
        <text x="110" y="655" fill="#FFFFFF" font-family="Arial Rounded MT Bold" font-size="20" font-weight="850" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="110" dy="0">01</tspan>
  </text>
        <text x="110" y="703" fill="#FFFFFF" font-family="Arial" font-size="20" font-weight="700" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="110" dy="0">Approve the family experience</tspan>
  </text><rect x="572" y="600" width="450" height="150" rx="26" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
        <text x="600" y="655" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="20" font-weight="850" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="600" dy="0">02</tspan>
  </text>
        <text x="600" y="703" fill="#163B74" font-family="Arial" font-size="20" font-weight="700" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="600" dy="0">Release store credentials and</tspan><tspan x="600" dy="27">assets</tspan>
  </text><rect x="1062" y="600" width="450" height="150" rx="26" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
        <text x="1090" y="655" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="20" font-weight="850" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1090" dy="0">03</tspan>
  </text>
        <text x="1090" y="703" fill="#163B74" font-family="Arial" font-size="20" font-weight="700" text-anchor="start" opacity="1"  letter-spacing="0">
