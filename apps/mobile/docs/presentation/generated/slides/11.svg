<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#163B74" flood-opacity="0.12"/>
      </filter>
      <clipPath id="phoneClip"><rect x="1166" y="95" width="304" height="660" rx="42"/></clipPath>
    </defs>
    
    
    <rect width="1600" height="900" fill="#F0F8FF"/>
    <circle cx="1510" cy="-30" r="245" fill="#FF2462" opacity="0.11"/>
    <circle cx="35" cy="910" r="210" fill="#6D28D9" opacity="0.09"/>
    <rect x="64" y="46" width="176" height="42" rx="21" fill="#FFE4EE"/>
    <text x="152" y="74" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="17" font-weight="700" text-anchor="middle" opacity="1"  letter-spacing="1.1">
    <tspan x="152" dy="0">WHY APPROVE</tspan>
  </text>
    <text x="64" y="132" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="48" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">A family product with a memorable</tspan><tspan x="64" dy="56">heart</tspan>
  </text>
    <line x1="64" y1="842" x2="1536" y2="842" stroke="#BFE2FA" stroke-width="2"/>
    <text x="64" y="874" fill="#4F6990" font-family="Arial" font-size="17" font-weight="600" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">FunBerry Kids</tspan>
  </text>
    <text x="1536" y="874" fill="#4F6990" font-family="Arial" font-size="17" font-weight="700" text-anchor="end" opacity="1"  letter-spacing="0">
    <tspan x="1536" dy="0">11</tspan>
  </text>
  
    <text x="64" y="252" fill="#4F6990" font-family="Arial" font-size="30" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="64" dy="0">FunBerry is designed to delight children without asking</tspan><tspan x="64" dy="40">grown-ups to surrender clarity or control.</tspan>
  </text>
    <rect x="64" y="430" width="456" height="300" rx="28" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
        <circle cx="126" cy="495" r="29" fill="#FFE4EE"/>
   <text x="126" y="502.54" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="24.94" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="126" dy="0">♥</tspan>
  </text>
        <text x="102" y="570" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="25" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="102" dy="0">Children want to return</tspan>
  </text>
        <text x="102" y="650" fill="#4F6990" font-family="Arial" font-size="18" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="102" dy="0">The Berry identity, zones and</tspan><tspan x="102" dy="25">reward loop create a recognisable</tspan><tspan x="102" dy="25">world.</tspan>
  </text><rect x="564" y="430" width="456" height="300" rx="28" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
        <circle cx="626" cy="495" r="29" fill="#FFE4EE"/>
   <text x="626" y="502.54" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="24.94" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="626" dy="0">✓</tspan>
  </text>
        <text x="602" y="570" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="25" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="602" dy="0">Grown-ups stay informed</tspan>
  </text>
        <text x="602" y="650" fill="#4F6990" font-family="Arial" font-size="18" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="602" dy="0">Profiles, progress and account</tspan><tspan x="602" dy="25">controls make family use</tspan><tspan x="602" dy="25">understandable.</tspan>
  </text><rect x="1064" y="430" width="456" height="300" rx="28" fill="#FFFFFF" stroke="#BFE2FA" stroke-width="2"/>
        <circle cx="1126" cy="495" r="29" fill="#FFE4EE"/>
   <text x="1126" y="502.54" fill="#FF2462" font-family="Arial Rounded MT Bold" font-size="24.94" font-weight="800" text-anchor="middle" opacity="1"  letter-spacing="0">
    <tspan x="1126" dy="0">↗</tspan>
  </text>
        <text x="1102" y="570" fill="#163B74" font-family="Arial Rounded MT Bold" font-size="25" font-weight="800" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1102" dy="0">The platform can grow</tspan>
  </text>
        <text x="1102" y="650" fill="#4F6990" font-family="Arial" font-size="18" font-weight="500" text-anchor="start" opacity="1"  letter-spacing="0">
    <tspan x="1102" dy="0">Native and ticketed-game paths</tspan><tspan x="1102" dy="25">support a broader learning</tspan><tspan x="1102" dy="25">catalogue.</tspan>
  </text>
  
  </svg>